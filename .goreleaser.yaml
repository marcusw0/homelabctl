version: 2

project_name: homelabctl

builds:
  - id: homelabctl
    main: ./cmd/homelabctl
    binary: homelabctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: portable
    ids:
      - homelabctl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE.md

nfpms:
  - id: linux-packages
    ids:
      - homelabctl
    package_name: homelabctl
    vendor: Marcus Whited
    homepage: https://github.com/marcusw0/homelabctl
    maintainer: Marcus Whited <54700785+marcusw0@users.noreply.github.com>
    description: CLI tool for managing homelab services
    license: MIT
    bindir: /usr/bin
    formats:
      - deb
      - rpm
      - archlinux

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
